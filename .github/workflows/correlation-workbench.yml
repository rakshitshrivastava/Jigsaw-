name: Correlation workbench

on:
  push:
    paths:
      - 'tools/aisoc-advanced/**'
      - '.github/workflows/correlation-workbench.yml'
  pull_request:
    paths:
      - 'tools/aisoc-advanced/**'
      - '.github/workflows/correlation-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: CLI regression checks
        run: python -m unittest discover -s tools/aisoc-advanced/tests -v
      - name: Synthetic POC
        run: python tools/aisoc-advanced/poc/run_demo.py
